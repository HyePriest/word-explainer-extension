<!DOCTYPE html>
<html lang="zh-CN" data-we-theme-page>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>生词本 · 划词解释</title>
  <script src="../theme.js"></script>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">W</span>
      <div>
        <h1>生词本</h1>
        <p id="summary">正在读取…</p>
      </div>
    </div>
    <div class="top-actions">
      <button id="export-json" class="button secondary" type="button">导出 JSON</button>
      <button id="import-json" class="button secondary" type="button">导入并合并</button>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
    </div>
  </header>

  <main>
    <section class="controls" aria-label="筛选与批量操作">
      <div class="tabs" role="tablist">
        <button class="tab active" data-filter="pending" type="button">未整理 <span id="pending-count">0</span></button>
        <button class="tab" data-filter="organized" type="button">已整理 <span id="organized-count">0</span></button>
        <button class="tab" data-filter="all" type="button">全部 <span id="all-count">0</span></button>
      </div>
      <div class="filters">
        <input id="search" type="search" placeholder="搜索单词、原句或来源" aria-label="搜索生词">
        <select id="source-filter" aria-label="按来源筛选">
          <option value="">全部来源</option>
        </select>
      </div>
      <div class="selection-row">
        <label><input id="select-visible" type="checkbox"> 选择当前结果</label>
        <span id="selection-count">已选 0 个</span>
        <div class="batch-actions">
          <button id="copy-organize" class="button primary" type="button" disabled>复制 Markdown 并标记已整理</button>
          <button id="copy-words" class="button secondary" type="button" disabled>复制纯单词</button>
          <button id="mark-organized" class="button secondary" type="button" disabled>标记已整理</button>
          <button id="mark-pending" class="button secondary" type="button" disabled>撤销整理</button>
          <button id="delete-selected" class="button danger" type="button" disabled>删除</button>
        </div>
      </div>
      <p class="workflow-note">复制 Markdown 成功后才会记录整理日期。JSON 会保存到浏览器的下载位置，在另一浏览器选择“导入并合并”即可手动同步。</p>
    </section>

    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <section id="word-list" class="word-list"></section>
    <section id="empty-state" class="empty-state" hidden>
      <div>☆</div>
      <h2>这里还没有符合条件的单词</h2>
      <p>在网页或 PDF 中划选英文单词，再从翻译框的星标加入生词本。</p>
    </section>
  </main>

  <script src="index.js"></script>
  <script src="../positioning.js"></script>
  <script src="../output-formatting.js"></script>
  <script src="../shortcuts.js"></script>
  <script src="../content.js"></script>
</body>
</html>
