<!DOCTYPE html>
<html lang="zh-CN" data-we-theme-page>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>划词解释</title>
  <script src="../theme.js"></script>
  <style>
    :root {
      color-scheme: light;
      --page: #fafafa;
      --text: #27272a;
      --label: #333;
      --muted: #8b8b94;
      --field-label: #52525b;
      --line: #e9e9ed;
      --input: #fff;
      --input-line: #dcdce3;
      --focus: #818cf8;
      --focus-ring: rgba(99, 102, 241, .1);
      --secondary-text: #71717a;
      --secondary-bg: #ededf2;
      --success: #16a34a;
      --error: #dc2626;
      --reader-text: #4f46e5;
      --reader-bg: rgba(99, 102, 241, .09);
      --reader-line: rgba(99, 102, 241, .16);
      --ocr-text: #047857;
      --ocr-bg: rgba(16, 185, 129, .09);
      --ocr-line: rgba(16, 185, 129, .2);
      --vocabulary-text: #b45309;
      --vocabulary-bg: rgba(245, 158, 11, .09);
      --vocabulary-line: rgba(245, 158, 11, .2);
      --toggle-off: #d4d4d8;
    }
    :root[data-we-theme="dark"] {
      color-scheme: dark;
      --page: #18181c;
      --text: #e7e7ee;
      --label: #ededf3;
      --muted: #a1a1b0;
      --field-label: #c4c4d0;
      --line: #33333e;
      --input: #24242c;
      --input-line: #43434f;
      --focus: #a5b4fc;
      --focus-ring: rgba(129, 140, 248, .22);
      --secondary-text: #d0d0dd;
      --secondary-bg: #30303b;
      --success: #4ade80;
      --error: #fca5a5;
      --reader-text: #b5b9ff;
      --reader-bg: rgba(129, 140, 248, .15);
      --reader-line: rgba(129, 140, 248, .3);
      --ocr-text: #6ee7b7;
      --ocr-bg: rgba(16, 185, 129, .13);
      --ocr-line: rgba(52, 211, 153, .3);
      --vocabulary-text: #fcd34d;
      --vocabulary-bg: rgba(245, 158, 11, .13);
      --vocabulary-line: rgba(251, 191, 36, .3);
      --toggle-off: #52525e;
    }
    * { box-sizing: border-box; }
    body {
      width: 380px;
      margin: 0;
      padding: 17px 18px 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      color: var(--text);
      background: var(--page);
    }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .label { font-size: 13px; color: var(--label); font-weight: 600; }
    .sub { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.45; }
    .section { margin-top: 15px; padding-top: 14px; border-top: 1px solid var(--line); }
    .field-label { display: block; margin-bottom: 6px; font-size: 12px; color: var(--field-label); font-weight: 600; }
    input[type="password"], input[type="text"], select {
      width: 100%;
      height: 34px;
      padding: 0 9px;
      border: 1px solid var(--input-line);
      border-radius: 8px;
      background: var(--input);
      color: var(--text);
      font-size: 12px;
      outline: none;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }
    input:focus, select:focus { border-color: var(--focus); box-shadow: 0 0 0 3px var(--focus-ring); }
    :root[data-we-theme="dark"] input::placeholder { color: var(--muted); opacity: 1; }
    .button-row { display: flex; gap: 7px; margin-top: 7px; }
    button {
      height: 32px;
      border: 0;
      border-radius: 8px;
      padding: 0 12px;
      cursor: pointer;
      font-size: 12px;
      transition: transform 120ms ease, filter 120ms ease;
    }
    button:active { transform: scale(.97); }
    .primary { flex: 1; color: white; background: linear-gradient(135deg, #6366f1, #7c3aed); }
    .secondary { color: var(--secondary-text); background: var(--secondary-bg); }
    .status { min-height: 16px; margin-top: 5px; font-size: 11px; color: var(--muted); }
    .status:empty { display: none; }
    .status.success { color: var(--success); }
    .status.error { color: var(--error); }
    .hidden { display: none; }
    .reader-button {
      width: 100%;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: var(--reader-text);
      background: var(--reader-bg);
      border: 1px solid var(--reader-line);
      font-weight: 600;
    }
    .reader-button svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .reader-button + .reader-button { margin-top: 7px; }
    .ocr-button { color: var(--ocr-text); background: var(--ocr-bg); border-color: var(--ocr-line); }
    #ocr-shortcut-hint { margin: 5px 0 7px; text-align: center; }
    .vocabulary-button { color: var(--vocabulary-text); background: var(--vocabulary-bg); border-color: var(--vocabulary-line); }
    .toggle { position: relative; width: 44px; height: 24px; flex: 0 0 auto; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: var(--toggle-off); border-radius: 24px; cursor: pointer; transition: background 180ms; }
    .slider::before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: transform 180ms; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
    input:checked + .slider { background: #6366f1; }
    input:checked + .slider::before { transform: translateX(20px); }
    #quick-text { width: 100%; min-height: 88px; resize: vertical; padding: 10px; border: 1px solid var(--input-line); border-radius: 8px; background: var(--input); color: var(--text); font-family: inherit; font-size: 13px; line-height: 1.5; }
    #quick-text:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
    #quick-result { max-height: 260px; overflow: auto; overflow-wrap: anywhere; font-size: 14px; line-height: 1.65; }
    #quick-result p { margin: 8px 0; }
    #quick-result ul { padding-left: 22px; }
    #quick-result table { width: 100%; border-collapse: collapse; }
    #quick-result td, #quick-result th { border: 1px solid var(--line); padding: 4px; }
    details > summary { cursor: pointer; font-size: 12px; color: var(--field-label); }
    button:disabled { opacity: .55; cursor: default; }
  </style>
</head>
<body>
  <label class="field-label" for="quick-text">快速翻译</label>
  <textarea id="quick-text" autofocus placeholder="在这里粘贴，自动翻译；手动输入后按 Ctrl+Enter"></textarea>
  <div class="button-row">
    <button id="quick-translate" class="primary" type="button">翻译</button>
    <button id="quick-copy" class="secondary" type="button" disabled>复制结果</button>
    <button id="quick-clear" class="secondary" type="button">清空</button>
  </div>
  <div id="quick-status" class="status" role="status" aria-live="polite"></div>
  <div id="quick-result" hidden></div>
  <div class="sub" id="launch-shortcut-hint">Ctrl+Shift+X 打开 · Chrome 新标签页也能用</div>
  <details class="section" id="settings">
  <summary>设置与其他工具</summary>
  <div class="section">
  <div class="row">
    <div>
      <div class="label">划词解释</div>
      <div class="sub" id="status-text">已关闭</div>
    </div>
    <label class="toggle" aria-label="开启划词解释">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </div>
  </div>

  <div class="section">
    <label class="field-label" for="theme">外观</label>
    <select id="theme" disabled>
      <option value="system">跟随系统（默认）</option>
      <option value="light">浅色</option>
      <option value="dark">深色</option>
    </select>
    <div id="theme-status" class="status" role="status" aria-live="polite"></div>
  </div>

  <div class="section">
    <label class="field-label" for="model">使用模型</label>
    <select id="model">
      <option value="deepseek-v4-flash">V4 Flash · 快速（默认）</option>
      <option value="deepseek-v4-pro">V4 Pro · 高质量</option>
    </select>
    <div id="model-status" class="status"></div>
  </div>

  <div class="section row">
    <div>
      <div class="label">快速收藏按钮</div>
      <div class="sub">划选单词时显示第三个收藏按钮</div>
    </div>
    <label class="toggle" aria-label="显示快速收藏按钮">
      <input type="checkbox" id="show-quick-save">
      <span class="slider"></span>
    </label>
  </div>

  <div class="section">
    <label class="field-label" for="api-key">API Key</label>
    <input id="api-key" type="password" autocomplete="off" placeholder="sk-...">
    <div class="button-row">
      <button id="save-key" class="primary">保存</button>
      <button id="clear-key" class="secondary">删除</button>
    </div>
    <div id="key-status" class="status"></div>
  </div>

  <div class="section">
    <button id="start-page-ocr" class="reader-button ocr-button" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H4v4M16 3h4v4M8 21H4v-4M16 21h4v-4M7 9h10M7 12h10M7 15h7"/></svg>
      网页区域 OCR
    </button>
    <div class="sub" id="ocr-shortcut-hint">快捷键：Win+Shift+Y（当前网页内使用）</div>
    <button id="open-pdf-reader" class="reader-button" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 13h6M9 16h6"/></svg>
      打开 PDF 阅读器
    </button>
    <button id="open-vocabulary" class="reader-button vocabulary-button" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.8l2.45 4.96 5.48.8-3.97 3.86.94 5.46L12 16.3l-4.9 2.58.94-5.46-3.97-3.86 5.48-.8L12 3.8z"/></svg>
      打开生词本
    </button>
    <div id="ocr-status" class="status"></div>
  </div>

  </details>
  <script src="../output-formatting.js"></script>
  <script src="quick-translate.js"></script>
  <script src="popup.js"></script>
</body>
</html>
